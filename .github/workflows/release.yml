name: Build and release

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run tests without an installed client
        run: ./scripts/test.ps1
      - name: Build single executable
        run: ./scripts/build.ps1
      - name: Publish executable and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-release.ps1
